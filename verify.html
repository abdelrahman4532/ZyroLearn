<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Certificate Verification - ZYRO Learn</title>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'IBM Plex Sans Arabic', Arial, sans-serif;
            background: #f8f9fd;
            color: #0c1238;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: ltr;
        }
        .container {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 60px rgba(12, 29, 98, 0.15);
            padding: 32px 28px;
            text-align: center;
            border: 1px solid #dce0ea;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #0C1D62, #162b7a);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(12, 29, 98, 0.2);
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0C1D62;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 14px;
            color: #6b7596;
            margin-bottom: 24px;
        }
        .cert-card {
            background: #fafbff;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #eef0f7;
            margin-bottom: 20px;
            text-align: right;
            direction: rtl;
        }
        .cert-card .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eef0f7;
            font-size: 14px;
            flex-wrap: wrap;
        }
        .cert-card .row:last-child {
            border-bottom: none;
        }
        .cert-card .label {
            color: #6b7596;
            font-weight: 400;
        }
        .cert-card .value {
            color: #0c1238;
            font-weight: 600;
        }
        .cert-card .value.arabic {
            font-family: 'IBM Plex Sans Arabic', Arial, sans-serif;
        }
        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            margin-top: 8px;
        }
        .badge.invalid {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }
        .cert-image {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #dce0ea;
            margin-bottom: 16px;
            background: #fafbff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .cert-image img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            background: #0C1D62;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(12, 29, 98, 0.2);
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(12, 29, 98, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: #0C1D62;
            border: 2px solid #dce0ea;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #f0f2fa;
            box-shadow: none;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8f98b5;
        }
        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #eef0f7;
            border-top-color: #0C1D62;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #dc3545;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }
        .qr-container img {
            width: 120px;
            height: 120px;
            border: 2px solid #dce0ea;
            border-radius: 8px;
            padding: 6px;
            background: #ffffff;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .cert-card .row { font-size: 13px; }
            .btn { padding: 10px 20px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <!-- Dynamic content will be injected here -->
    </div>

    <script>
        // ===== FIREBASE CONFIGURATION (same as main app) =====
        const firebaseConfig = {
            apiKey: "AIzaSyDQvZhrxn_STjT-_HF3bWalVu61JB6JZFM",
            authDomain: "zyrolearn.firebaseapp.com",
            projectId: "zyrolearn",
            storageBucket: "zyrolearn.firebasestorage.app",
            messagingSenderId: "547630969129",
            appId: "1:547630969129:web:5211810a17ee1e26a00738"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Enable persistence
        db.enablePersistence({ synchronizeTabs: true })
            .catch(function(err) {
                console.warn('Persistence failed, continuing without:', err);
            });

        const content = document.getElementById('content');

        function showLoading() {
            content.innerHTML = `
                <div class="logo"><span style="font-size:28px;">ZYRO</span></div>
                <h1>Verifying Certificate</h1>
                <div class="loader"></div>
                <p style="color:#6b7596;font-size:14px;">Please wait while we validate the certificate...</p>
            `;
        }

        function showError(message) {
            content.innerHTML = `
                <div class="logo" style="background:#dc3545;"><span style="font-size:28px;">!</span></div>
                <h1 style="color:#dc3545;">Verification Failed</h1>
                <div class="error-icon">⚠️</div>
                <p style="color:#6b7596;font-size:14px;margin-bottom:16px;">${message}</p>
                <a href="https://abdelrahman4532.github.io/ZyroLearn/" class="btn btn-outline">Back to Home</a>
            `;
        }

        function showCertificate(data) {
            const completionDate = data.completionDate ? new Date(data.completionDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            }) : 'Not specified';

            // Generate a self-QR for verification page
            const verifyUrl = window.location.href;
            const qrApiUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(verifyUrl);

            let imageHtml = '';
            if (data.imageUrl) {
                imageHtml = `
                    <div class="cert-image">
                        <img src="${data.imageUrl}" alt="Certificate" />
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="logo">
                    <img src="Logo.png" alt="ZYRO" />
                </div>
                <h1>Certificate Verification</h1>
                <div class="sub">This certificate is officially issued by ZYRO Learn</div>

                ${imageHtml}

                <div class="cert-card">
                    <div class="row">
                        <span class="label">Certificate ID</span>
                        <span class="value" style="direction:ltr;font-family:monospace;">${data.certificateId || 'N/A'}</span>
                    </div>
                    <div class="row">
                        <span class="label">Student Name</span>
                        <span class="value">${data.userName || 'Student'}</span>
                    </div>
                    <div class="row">
                        <span class="label">Course</span>
                        <span class="value">${data.courseName || 'Course'}</span>
                    </div>
                    <div class="row">
                        <span class="label">Completion Date</span>
                        <span class="value">${completionDate}</span>
                    </div>
                    <div class="row">
                        <span class="label">Issued By</span>
                        <span class="value">ZYRO Learn</span>
                    </div>
                    ${data.isReissued ? `<div class="row"><span class="label">Reissued</span><span class="value">Yes (original ID: ${data.originalId || 'N/A'})</span></div>` : ''}
                </div>

                <div style="margin:12px 0;">
                    <span class="badge">✓ Verified & Authentic</span>
                </div>

                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-outline" onclick="window.print()">Print</button>
                </div>
                <div class="footer">ZYRO Learn — Building the future of education</div>
            `;
        }

        async function verifyCertificate(certId) {
            showLoading();

            try {
                const querySnapshot = await db.collection('certificates')
                    .where('certificateId', '==', certId)
                    .limit(1)
                    .get();

                if (querySnapshot.empty) {
                    showError('Certificate not found. Please check the ID and try again.');
                    return;
                }

                const doc = querySnapshot.docs[0];
                const data = doc.data();

                // Ensure required fields exist
                if (!data.certificateId || !data.userName || !data.courseName) {
                    showError('The certificate data is incomplete or corrupted.');
                    return;
                }

                showCertificate(data);
            } catch (error) {
                console.error('Verification error:', error);
                showError('An error occurred while verifying the certificate. Please try again later.');
            }
        }

        // ---- Main execution ----
        const params = new URLSearchParams(window.location.search);
        const certId = params.get('verify');

        if (!certId) {
            content.innerHTML = `
                <div class="logo"><span style="font-size:28px;">🔍</span></div>
                <h1>Verify a Certificate</h1>
                <p style="color:#6b7596;font-size:14px;margin:8px 0 20px;">No certificate ID provided. Please scan the QR code on your certificate.</p>
                <a href="https://abdelrahman4532.github.io/ZyroLearn/" class="btn btn-outline">Go to Home</a>
            `;
        } else {
            verifyCertificate(certId);
        }
    </script>
</body>
</html>
